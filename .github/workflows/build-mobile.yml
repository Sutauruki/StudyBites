name: Build Android app

# Build the mobile companion alongside the Windows installer whenever main
# changes. The Android project is generated from the Tauri source so it never
# drifts from the shared Rust and React implementation.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".devcontainer/**"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Configure Android binutils compatibility
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$RUNNER_TEMP/android-binutils"
          cat > "$RUNNER_TEMP/android-binutils/aarch64-linux-android-ranlib" <<'EOF'
          #!/usr/bin/env bash
          exec llvm-ar s "$@"
          EOF
          chmod +x "$RUNNER_TEMP/android-binutils/aarch64-linux-android-ranlib"
          echo "$RUNNER_TEMP/android-binutils" >> "$GITHUB_PATH"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "AARCH64_LINUX_ANDROID_RANLIB=$RUNNER_TEMP/android-binutils/aarch64-linux-android-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Set release version from tag
        run: node scripts/set-release-version.mjs

      - name: Generate the Android project
        run: npx tauri android init --ci --skip-targets-install

      - name: Use the desktop icon for Android
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Configure production Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::error::Missing ANDROID_KEY_BASE64. Add it as an Actions secret; see the README Android signing section."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing ANDROID_KEY_ALIAS. Add it as an Actions secret; see the README Android signing section."
            exit 1
          fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing ANDROID_KEY_PASSWORD. Add it as an Actions secret; see the README Android signing section."
            exit 1
          fi
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/studybites-release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/studybites-release.jks" \
            ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            node scripts/configure-android-signing.mjs

      - name: Build release APK
        env:
          STUDYBITES_LICENSE_PUBKEY: ${{ secrets.STUDYBITES_LICENSE_PUBKEY }}
          GRADLE_OPTS: "-Xmx2g -Dorg.gradle.workers.max=1"
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: npx tauri android build --ci --target aarch64 --apk

      - name: Verify the Android APK is signed
        run: |
          apk=$(find src-tauri/gen/android -path '*/build/outputs/apk/**/*.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No Android APK was produced."
            exit 1
          fi
          name=$(basename "$apk")
          size=$(stat -c '%s' "$apk")
          echo "APK: $name ($size bytes)"
          case "$name" in
            *-unsigned.apk)
              echo "::error::Unsigned APK produced: $name"
              exit 1
              ;;
          esac

      - name: Name the APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mapfile -t apks < <(find src-tauri/gen/android -path '*/build/outputs/apk/**/*.apk' -type f)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          version=$(node --input-type=module -e \
            "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")
          mkdir -p dist
          apk_name="StudyBites_${version}_arm64.apk"
          cp "${apks[0]}" "dist/${apk_name}"
          echo "APK_NAME=${apk_name}" >> "$GITHUB_ENV"
          echo "Named APK: ${apk_name}"

          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -n "$apksigner" ]; then
            certs=$("$apksigner" verify --print-certs "dist/${apk_name}")
            printf '%s\n' "$certs"
            fingerprint=$(printf '%s\n' "$certs" | grep -m1 'certificate SHA-256 digest:')
            if [ -z "$fingerprint" ]; then
              echo "::error::apksigner did not print a certificate SHA-256 fingerprint."
              exit 1
            fi
            echo "Signing certificate: ${fingerprint}"
          else
            echo "apksigner was not found; skipping certificate fingerprint verification."
          fi

      - name: Remove stale APKs from rolling latest
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if assets=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null); then
            while IFS= read -r asset; do
              if [[ "$asset" == *.apk && "$asset" != "$APK_NAME" ]]; then
                gh release delete-asset latest "$asset" --yes
              fi
            done <<< "$assets"
          else
            echo "Latest release was not found; no stale APKs to remove."
          fi

      - name: Publish to the rolling latest pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: dist/StudyBites_*_arm64.apk
          fail_on_unmatched_files: true

      - name: Publish Android APK
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: StudyBites ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/StudyBites_*_arm64.apk
          fail_on_unmatched_files: true

      - name: Write release summary
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_url="${SERVER_URL}/${REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            release_url="${SERVER_URL}/${REPOSITORY}/releases/tag/latest"
          fi
          echo "Android release asset: \`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: [${APK_NAME}](${release_url})" >> "$GITHUB_STEP_SUMMARY"
