[workspace]
resolver = "2"
members = ["crates/studybites-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["Odejayi Ezekiel (Sutauruki)"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release hardening (Section 10). Applies to the whole workspace.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
incremental = false
