[package]
name = "studybites"
description = "StudyBites — distraction-free study app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license-file = "../LICENSE"
default-run = "studybites"

[lib]
name = "studybites_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studybites-core = { path = "../crates/studybites-core" }
tauri = { version = "2.12", features = [] }
# File picker and "open the download page", both needed by Phase 2's UI.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# API keys live in the OS keychain (Windows DPAPI), never in the database.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-fs = "2"
