[package]
name = "studybites-core"
description = "StudyBites core: encrypted storage, migrations and domain logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license-file = "../../LICENSE"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
# HTTP with rustls, so nothing here needs a system TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Text extraction: PDF, and DOCX via its zip container.
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Cold storage: compress, then (Phase 3) encrypt.
zstd = "0.13"
sha2 = "0.10"
# Phase 3 — licensing and encryption at rest.
# Verification only in the app; signing lives in the license-tool crate.
ed25519-dalek = "2"
hkdf = "0.12"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Device fingerprint: registry reads only. No WMI, no COM, no spawning wmic.
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
