[package]
name = "studybites-core"
description = "StudyBites core: encrypted storage, migrations and domain logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false
license-file = "../../LICENSE"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
# HTTP with rustls, so nothing here needs a system TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Text extraction: PDF, and DOCX via its zip container.
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Cold storage: compress, then (Phase 3) encrypt.
zstd = "0.13"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
